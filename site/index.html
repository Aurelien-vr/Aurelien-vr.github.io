<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portrait culturel — Accès privé</title>
<link rel="stylesheet" href="style.css">
<style>
  .login-page { align-items: center; display: flex; justify-content: center; min-height: 100vh; overflow: hidden; padding: 32px; position: relative; }
  .login-page .blob { display: block; }
  .login-card { border: 1px solid var(--fg); max-width: 620px; padding: clamp(28px, 6vw, 72px); position: relative; width: 100%; z-index: 2; }
  .login-card::before { border: 1px dotted var(--line); content: ""; inset: 12px; pointer-events: none; position: absolute; }
  .login-kicker, .login-meta { color: var(--dim); font-size: 11px; position: relative; text-transform: uppercase; z-index: 1; }
  .login-card h1 { font-size: clamp(48px, 10vw, 110px); line-height: .9; margin: 28px 0; position: relative; text-transform: uppercase; z-index: 1; }
  .login-card h1 em { color: var(--dim); font-style: normal; }
  .login-card form, .login-card label, .login-card input, .login-card button { position: relative; z-index: 1; }
  .login-card label { color: var(--dim); display: block; font-size: 11px; text-transform: uppercase; }
  .login-card input, .login-card button { background: transparent; border: 1px solid var(--fg); color: var(--fg); display: block; font: inherit; margin-top: 10px; padding: 13px 15px; width: 100%; }
  .login-card input:focus { outline: 1px solid #1d8fd1; }
  .login-card button { background: var(--fg); color: #000; cursor: pointer; font-family: 'Silkscreen', monospace; font-size: 12px; text-transform: uppercase; transition: .2s; }
  .login-card button:hover { background: #1d8fd1; color: #fff; }
  .login-card .error { color: #ff6a1a; font-size: 12px; position: relative; z-index: 1; }
  .login-mark { color: var(--dim); font-size: 72px; line-height: 1; position: absolute; right: 7%; top: 10%; }
  .login-page .marquee { bottom: 0; }
</style>
</head>
<body class="login-page">
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<span class="login-mark">+</span>
<main class="login-card">
  <p class="login-kicker pixel">PC/01 · Communication interculturelle</p>
  <h1 class="pixel">ACCÈS<br><em>PRIVÉ</em></h1>
  <form id="login-form">
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Déverrouiller ↗</button>
    <p id="login-error" class="error" role="alert" hidden>Mot de passe incorrect.</p>
  </form>
  <p class="login-meta">Portrait culturel · Aurélien V. · 2026–2027</p>
</main>
<div class="marquee" aria-hidden="true"><div><span>NORMES ✦ VALEURS ✦ PRATIQUES ✦ IDENTITÉ CULTURELLE ✦ BENNETT ✦ </span><span>NORMES ✦ VALEURS ✦ PRATIQUES ✦ IDENTITÉ CULTURELLE ✦ BENNETT ✦ </span></div></div>
<script src="content.enc.js"></script>
<script src="auth.js"></script>
</body>
</html>
