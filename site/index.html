<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portrait culturel — Accès privé</title>
<link rel="stylesheet" href="style.css">
<style>
  body { align-items: center; display: flex; justify-content: center; min-height: 100vh; }
  .login { background: #10131a; border: 1px solid #343c4d; max-width: 32rem; padding: 2rem; width: calc(100% - 2rem); }
  .login h1 { margin-top: 0; }
  .login label, .login input, .login button { display: block; width: 100%; }
  .login input, .login button { font: inherit; margin-top: .5rem; padding: .7rem; }
  .login input { background: #181d27; border: 1px solid #56627a; color: inherit; }
  .login button { background: #d7ff3f; border: 0; cursor: pointer; font-weight: 700; }
  .error { color: #ff8f8f; }
</style>
</head>
<body>
<main class="login">
  <form id="login-form">
    <h1>Accès privé</h1>
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Entrer</button>
    <p id="login-error" class="error" role="alert" hidden>Mot de passe incorrect.</p>
  </form>
</main>
<script src="content.enc.js"></script>
<script src="auth.js"></script>
</body>
</html>
